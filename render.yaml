services:
  - type: web
    name: messari-lrfb
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_NAME
        value: MESSARI - LRF Blida
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://messari-lrfb.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SEED_ON_DEPLOY
        value: true
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
